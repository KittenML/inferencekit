[project]
name = "inferencekit-cli"
version = "0.1.0"
authors = [{ name = "Stellon Labs" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
description = "Make your model serve faster on your GPU, and prove it. Skills for Claude Code, Codex and OpenCode, plus a CLI and MCP server: your agent picks and tunes inference engines, can write GPU kernels, and backs every number with client-timed benchmarks, anti-cheat gates and quality checks."
requires-python = ">=3.10"
keywords = [
    "inference", "llm", "serving", "benchmarking", "capacity", "profiling", "quantization", "roofline", "gpu",
    "nvidia", "cuda", "mcp", "nsight-systems", "nsight-compute", "correctness", "vllm", "sglang", "llama.cpp",
    "tensorrt-llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
# Deliberately small. Engines (vLLM, SGLang, llama.cpp, TensorRT-LLM) are NOT dependencies:
# the benchmark adapters run them in their own interpreter, as external binaries or as servers.
dependencies = [
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

# The repository URL lives here and only here.
[project.urls]
Homepage = "https://github.com/kittenml/inferencekit"
Repository = "https://github.com/kittenml/inferencekit"
Issues = "https://github.com/kittenml/inferencekit/issues"

[project.scripts]
inferencekit = "inferencekit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under the package ships, including non-Python data such as
# src/inferencekit/prompts/ (the dev prompt set) and src/inferencekit/cuda/*.cu.
packages = ["src/inferencekit"]

# The schemas live at the repo root (they are part of the public contract); ship a copy
# of the whole directory inside the wheel so an installed package can validate records too.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "inferencekit/schemas"

# The source distribution carries the package, its schemas, tests, release scripts and the legal files.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/tests",
    "/scripts/release",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD_PARTY_NOTICES.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
